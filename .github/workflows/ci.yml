name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: PTY prebuild diagnostics
        if: runner.os != 'Windows'
        run: |
          ls -l node_modules/node-pty/prebuilds/*/ || true
          ls -l node_modules/node-pty/build/Release/ || true
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
